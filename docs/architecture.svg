<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="100%" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <rect width="1200" height="810" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">RentAI · 已实现架构图</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#6b7280">以真实代码为准（Python 3.12 · FastAPI · LangGraph · React 18 · PostgreSQL+pgvector · Redis）</text>

  <!-- 层标题 -->
  <g font-size="13" fill="#9ca3af" letter-spacing="2">
    <text x="600" y="100" text-anchor="middle">— 客 户 端 —</text>
    <text x="600" y="228" text-anchor="middle">— 接 入 层 —</text>
    <text x="600" y="345" text-anchor="middle">— Agent 服 务 层 —</text>
    <text x="600" y="570" text-anchor="middle">— 数 据 与 基 础 设 施 —</text>
  </g>

  <!-- 向下小三角 -->
  <g fill="#cbd5e1">
    <polygon points="594,203 606,203 600,213"/>
    <polygon points="594,323 606,323 600,333"/>
    <polygon points="594,548 606,548 600,558"/>
  </g>

  <!-- ===== 层1 客户端（统一主页面 + 辅助页） ===== -->
  <g>
    <rect x="162" y="120" width="200" height="68" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
    <rect x="387" y="120" width="200" height="68" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
    <rect x="612" y="120" width="200" height="68" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
    <rect x="837" y="120" width="200" height="68" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>

    <text x="262" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1967d2">智能助手</text>
    <text x="262" y="170" text-anchor="middle" font-size="11.5" fill="#4b5563">统一对话入口 · 主页面</text>

    <text x="487" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1967d2">看房清单</text>
    <text x="487" y="170" text-anchor="middle" font-size="11.5" fill="#4b5563">确认/调整闭环 · PG 持久化</text>

    <text x="712" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1967d2">知识库</text>
    <text x="712" y="170" text-anchor="middle" font-size="11.5" fill="#4b5563">PDF/PPT/Excel 入库 · 引用检索</text>

    <text x="937" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1967d2">观测台</text>
    <text x="937" y="170" text-anchor="middle" font-size="11.5" fill="#4b5563">评测指标 · 对话用量 · 数据基线</text>
  </g>

  <!-- ===== 层2 接入层 ===== -->
  <g>
    <rect x="400" y="248" width="400" height="60" rx="10" fill="#d2e3fc" stroke="#1967d2" stroke-width="1.5"/>
    <text x="600" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#174ea6">FastAPI REST + SSE　8000</text>
    <text x="600" y="295" text-anchor="middle" font-size="11.5" fill="#4b5563">路由 · JWT 鉴权 · RBAC · 多租户隔离</text>
  </g>

  <!-- ===== 层3 Agent 服务层（模式路由 + 两种执行模式） ===== -->
  <g>
    <!-- 第一行 -->
    <rect x="50"  y="365" width="200" height="74" rx="10" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
    <rect x="275" y="365" width="200" height="74" rx="10" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
    <rect x="500" y="365" width="200" height="74" rx="10" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
    <rect x="725" y="365" width="200" height="74" rx="10" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>

    <text x="150" y="393" text-anchor="middle" font-size="15" font-weight="bold" fill="#7b1fa2">模式路由</text>
    <text x="150" y="415" text-anchor="middle" font-size="11.5" fill="#4b5563">AI 自主选择 Workflow / ReAct</text>

    <text x="375" y="393" text-anchor="middle" font-size="15" font-weight="bold" fill="#7b1fa2">LangGraph 管道</text>
    <text x="375" y="415" text-anchor="middle" font-size="11.5" fill="#4b5563">Workflow · 确定性流水线</text>

    <text x="600" y="393" text-anchor="middle" font-size="15" font-weight="bold" fill="#7b1fa2">ReAct 自主决策</text>
    <text x="600" y="415" text-anchor="middle" font-size="11.5" fill="#4b5563">function calling · 反思自纠错</text>

    <text x="825" y="393" text-anchor="middle" font-size="15" font-weight="bold" fill="#7b1fa2">Harness 护栏</text>
    <text x="825" y="415" text-anchor="middle" font-size="11.5" fill="#4b5563">输入越界 · 死循环 · 上下文膨胀</text>

    <!-- 第二行 -->
    <rect x="50"  y="459" width="200" height="74" rx="10" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
    <rect x="275" y="459" width="200" height="74" rx="10" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
    <rect x="500" y="459" width="200" height="74" rx="10" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
    <rect x="725" y="459" width="200" height="74" rx="10" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>

    <text x="150" y="487" text-anchor="middle" font-size="15" font-weight="bold" fill="#7b1fa2">混合检索 RAG</text>
    <text x="150" y="509" text-anchor="middle" font-size="11.5" fill="#4b5563">关键词 ∪ pgvector 语义 → 重排</text>

    <text x="375" y="487" text-anchor="middle" font-size="15" font-weight="bold" fill="#7b1fa2">多模态文档库</text>
    <text x="375" y="509" text-anchor="middle" font-size="11.5" fill="#4b5563">解析 · 切块 · embedding · 引用</text>

    <text x="600" y="487" text-anchor="middle" font-size="15" font-weight="bold" fill="#7b1fa2">MCP 服务</text>
    <text x="600" y="509" text-anchor="middle" font-size="11.5" fill="#4b5563">房源/地图工具标准协议暴露</text>

    <text x="825" y="487" text-anchor="middle" font-size="15" font-weight="bold" fill="#7b1fa2">可观测收集器</text>
    <text x="825" y="509" text-anchor="middle" font-size="11.5" fill="#4b5563">token · 延迟 · 成本 · 对话轮次</text>
  </g>

  <!-- ===== 层4 数据与基础设施 ===== -->
  <g>
    <rect x="275" y="590" width="200" height="74" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
    <rect x="500" y="590" width="200" height="74" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
    <rect x="725" y="590" width="200" height="74" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>

    <text x="375" y="618" text-anchor="middle" font-size="15" font-weight="bold" fill="#137333">PostgreSQL + pgvector</text>
    <text x="375" y="640" text-anchor="middle" font-size="11.5" fill="#4b5563">房源向量 · 文档块 · 看房清单</text>

    <text x="600" y="618" text-anchor="middle" font-size="15" font-weight="bold" fill="#137333">Redis</text>
    <text x="600" y="640" text-anchor="middle" font-size="11.5" fill="#4b5563">会话记忆 · 用户画像 · 缓存</text>

    <text x="825" y="618" text-anchor="middle" font-size="15" font-weight="bold" fill="#137333">阿里云百炼</text>
    <text x="825" y="640" text-anchor="middle" font-size="11.5" fill="#4b5563">qwen-plus · embedding · rerank</text>
  </g>

  <!-- 底部验收 -->
  <g font-size="12" fill="#374151">
    <text x="120" y="710">✅ 确定性评测全绿（precision@k=1.0 / recall=1.0 / risk_recall=1.0）</text>
    <text x="120" y="732">✅ Agent 决策可追溯（工具调用轨迹 + 反思日志）　✅ 语义评测出值（faithfulness 0.83 / context_precision 0.67）</text>
    <text x="120" y="754">✅ 看房清单 PG 持久化（跨刷新可复用）　✅ 多模态文档知识库带引用检索</text>
  </g>

  <!-- 调用链 -->
  <text x="600" y="788" text-anchor="middle" font-size="12" fill="#6b7280">智能助手 → FastAPI(8000) → 模式路由(AI 自主选 Workflow/ReAct) → 混合检索/文档库 → PostgreSQL+pgvector / Redis → 阿里云百炼</text>
</svg>
