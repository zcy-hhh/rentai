<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <style>
      .layer-title{font-size:13px;font-weight:700;fill:#4F6B9A;letter-spacing:.5px}
      .card{fill:#fff;stroke:#D8DEE6;stroke-width:1;rx:10}
      .card-title{font-size:13px;font-weight:600;fill:#1A1B1C}
      .card-desc{font-size:11px;fill:#5F6670}
      .arrow{stroke:#B0B8C4;stroke-width:1.5;fill:none;marker-end:url(#ah)}
    </style>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#B0B8C4"/></marker>
  </defs>
  <rect width="920" height="760" fill="#F7F7F5"/>
  <text x="40" y="36" class="layer-title">客户端 · C 端 Web</text>
  <g>
    <rect x="40" y="48" width="200" height="64" class="card"/><rect x="40" y="48" width="6" height="64" fill="#4F6B9A" rx="3"/>
    <text x="58" y="72" class="card-title">智能助手</text><text x="58" y="90" class="card-desc">单一主页面 · 自然语言对话</text><text x="58" y="104" class="card-desc">AI 自主路由模式</text>
    <rect x="260" y="48" width="200" height="64" class="card"/><rect x="260" y="48" width="6" height="64" fill="#35705A" rx="3"/>
    <text x="278" y="72" class="card-title">看房清单</text><text x="278" y="90" class="card-desc">对话结果主动保存</text><text x="278" y="104" class="card-desc">PG 持久化 · 确认/调整</text>
    <rect x="480" y="48" width="200" height="64" class="card"/><rect x="480" y="48" width="6" height="64" fill="#9A6A2F" rx="3"/>
    <text x="498" y="72" class="card-title">租房知识库</text><text x="498" y="90" class="card-desc">多模态文档入库</text><text x="498" y="104" class="card-desc">PDF / PPT / Excel</text>
    <rect x="700" y="48" width="180" height="64" class="card"/><rect x="700" y="48" width="6" height="64" fill="#A14E50" rx="3"/>
    <text x="718" y="72" class="card-title">观测后台</text><text x="718" y="90" class="card-desc">对话用量 · 评测指标</text><text x="718" y="104" class="card-desc">实时自动刷新</text>
  </g>
  <line x1="460" y1="112" x2="460" y2="138" class="arrow"/>
  <text x="40" y="158" class="layer-title">接入层</text>
  <rect x="40" y="170" width="840" height="48" class="card"/><rect x="40" y="170" width="6" height="48" fill="#4F6B9A" rx="3"/>
  <text x="58" y="192" class="card-title">FastAPI · SSE 流式响应 · JWT 鉴权 / RBAC · 多租户隔离</text>
  <text x="58" y="208" class="card-desc">REST + Server-Sent Events · 统一异常处理 · 请求级可观测埋点</text>
  <line x1="460" y1="218" x2="460" y2="244" class="arrow"/>
  <text x="40" y="264" class="layer-title">Agent 服务层</text>
  <g>
    <rect x="40" y="276" width="260" height="80" class="card"/><rect x="40" y="276" width="6" height="80" fill="#4F6B9A" rx="3"/>
    <text x="58" y="300" class="card-title">对话式 Agent</text><text x="58" y="318" class="card-desc">意图解析 → 澄清追问 → 执行</text><text x="58" y="334" class="card-desc">多轮上下文 · 前端历史为真相源</text><text x="58" y="350" class="card-desc">增量执行，不重复生成</text>
    <rect x="320" y="276" width="260" height="80" class="card"/><rect x="320" y="276" width="6" height="80" fill="#6B5B9A" rx="3"/>
    <text x="338" y="300" class="card-title">模式路由（AI 自主）</text><text x="338" y="318" class="card-desc">需求明确 → workflow 确定性管道</text><text x="338" y="334" class="card-desc">需求复杂 → react 自主决策+反思</text><text x="338" y="350" class="card-desc">模型通过 function calling 自选</text>
    <rect x="600" y="276" width="280" height="80" class="card"/><rect x="600" y="276" width="6" height="80" fill="#A14E50" rx="3"/>
    <text x="618" y="300" class="card-title">Harness 治理层</text><text x="618" y="318" class="card-desc">输入越界护栏 · 死循环护栏</text><text x="618" y="334" class="card-desc">候选截断防上下文膨胀</text><text x="618" y="350" class="card-desc">引用约束防幻觉 · 人工兜底</text>
  </g>
  <g>
    <rect x="40" y="372" width="400" height="72" class="card"/><rect x="40" y="372" width="6" height="72" fill="#35705A" rx="3"/>
    <text x="58" y="396" class="card-title">确定性管道（LangGraph）</text><text x="58" y="414" class="card-desc">检索 → 过滤 → 排序 → 避坑 → 清单</text><text x="58" y="430" class="card-desc">固定五节点 · 快速稳定 · 可复现</text>
    <rect x="460" y="372" width="420" height="72" class="card"/><rect x="460" y="372" width="6" height="72" fill="#9A6A2F" rx="3"/>
    <text x="478" y="396" class="card-title">ReAct 自主决策 + 反思自纠错</text><text x="478" y="414" class="card-desc">function calling 自选工具与顺序</text><text x="478" y="430" class="card-desc">Reflexion 评估不通过 → 反思重跑</text>
  </g>
  <rect x="40" y="460" width="840" height="48" class="card"/><rect x="40" y="460" width="6" height="48" fill="#7A6B5A" rx="3"/>
  <text x="58" y="482" class="card-title">记忆层</text>
  <text x="58" y="500" class="card-desc">短期 = 会话历史（Redis TTL 1天）　|　长期 = 用户画像（Redis TTL 7天）　|　Redis 不可用自动降级进程内存</text>
  <line x1="460" y1="508" x2="460" y2="534" class="arrow"/>
  <text x="40" y="554" class="layer-title">工具与数据服务</text>
  <g>
    <rect x="40" y="566" width="200" height="64" class="card"/><rect x="40" y="566" width="6" height="64" fill="#4F6B9A" rx="3"/>
    <text x="58" y="590" class="card-title">混合检索 RAG</text><text x="58" y="608" class="card-desc">关键词 ∪ 语义 → gte-rerank</text><text x="58" y="622" class="card-desc">pgvector 向量库</text>
    <rect x="260" y="566" width="200" height="64" class="card"/><rect x="260" y="566" width="6" height="64" fill="#9A6A2F" rx="3"/>
    <text x="278" y="590" class="card-title">文档知识库</text><text x="278" y="608" class="card-desc">PDF / PPT / Excel 解析</text><text x="278" y="622" class="card-desc">带来源页码引用</text>
    <rect x="480" y="566" width="180" height="64" class="card"/><rect x="480" y="566" width="6" height="64" fill="#35705A" rx="3"/>
    <text x="498" y="590" class="card-title">通勤计算</text><text x="498" y="608" class="card-desc">高德 Web 服务</text><text x="498" y="622" class="card-desc">时间/距离排序</text>
    <rect x="680" y="566" width="200" height="64" class="card"/><rect x="680" y="566" width="6" height="64" fill="#A14E50" rx="3"/>
    <text x="698" y="590" class="card-title">看房清单服务</text><text x="698" y="608" class="card-desc">PG 持久化 · HITL</text><text x="698" y="622" class="card-desc">确认结果并入画像</text>
  </g>
  <line x1="460" y1="630" x2="460" y2="656" class="arrow"/>
  <text x="40" y="676" class="layer-title">基础设施</text>
  <g>
    <rect x="40" y="688" width="190" height="52" class="card"/><text x="135" y="710" class="card-title" text-anchor="middle">PostgreSQL + pgvector</text><text x="135" y="728" class="card-desc" text-anchor="middle">房源 · 清单 · 文档向量</text>
    <rect x="250" y="688" width="140" height="52" class="card"/><text x="320" y="710" class="card-title" text-anchor="middle">Redis</text><text x="320" y="728" class="card-desc" text-anchor="middle">会话 · 画像 · 缓存</text>
    <rect x="410" y="688" width="140" height="52" class="card"/><text x="480" y="710" class="card-title" text-anchor="middle">MinIO</text><text x="480" y="728" class="card-desc" text-anchor="middle">文档对象存储</text>
    <rect x="570" y="688" width="310" height="52" class="card"/><text x="725" y="710" class="card-title" text-anchor="middle">阿里云百炼</text><text x="725" y="728" class="card-desc" text-anchor="middle">qwen-plus · text-embedding-v4 · gte-rerank</text>
  </g>
</svg>